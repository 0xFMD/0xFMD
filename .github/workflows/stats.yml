name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 06:17
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    paths:
      - "scripts/**"
      - "README.template.md"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate panels
        run: node scripts/generate.mjs
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
